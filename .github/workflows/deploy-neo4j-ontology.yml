name: Deploy Neo4j M1 Ontology

on:
    push:
        branches:
            - develop # develop 브랜치에 코드가 push(또는 PR merge) 될 때만 실행됩니다.
        paths:
            - "v2.0_ontology/**/*.cypher" # 이 폴더 안의 모든 .cypher 파일 변경 감지
        workflow_dispatch: # 깃허브 화면에 [수동 실행 버튼]을 생성

jobs:
    deploy-cypher:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install Java 17
              uses: actions/setup-java@v3
              with:
                  distribution: "temurin"
                  java-version: "17" # cypher-shell 구동을 위해 필요합니다.

            - name: Download & Install cypher-shell
              run: |
                  wget https://dist.neo4j.org/cypher-shell/cypher-shell-5.19.0.zip
                  unzip cypher-shell-5.19.0.zip
                  echo "$PWD/cypher-shell-5.19.0/bin" >> $GITHUB_PATH

            - name: Deploy Ontology to Neo4j AuraDB
              env:
                  NEO4J_URI: ${{ secrets.NEO4J_URI }} # 예: neo4j+s://<DB-ID>.databases.neo4j.io
                  NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }} # 예: neo4j
                  NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }} # 비밀번호
              run: |
                  echo "Cypher 쿼리를 AuraDB에 배포합니다..."
                  # v2.0_ontology 폴더 안의 모든 .cypher 파일을 찾아서 하나씩 실행합니다.
                  for file in ./v2.0_ontology/*.cypher; do
                      echo "실행 중: $file"
                      cat "$file" | cypher-shell \
                      -a "$NEO4J_URI" \
                      -u "$NEO4J_USERNAME" \
                      -p "$NEO4J_PASSWORD"
                  done
                  echo "✅ 모든 Neo4j M1 Ontology 파일 배포 완료!"

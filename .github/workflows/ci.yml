name: Neo4j Cypher Test CI

on:
    pull_request:
        branches: ["main", "develop"]
    push:
        branches: ["develop"]
    workflow_dispatch: # 수동으로도 실행할 수 있도록 추가

jobs:
    test-and-verify-cypher:
        runs-on: ubuntu-latest

        # 1. 테스트용 빈 Neo4j 컨테이너 실행
        services:
            neo4j:
                image: neo4j:5
                env:
                    NEO4J_AUTH: neo4j/testpassword
                ports:
                    - 7687:7687
                # DB가 완전히 켜질 때까지 기다리는 Health Check
                options: >-
                    --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
                    --health-interval 10s
                    --health-timeout 10s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. cypher-shell 설치
            - name: Install cypher-shell
              run: |
                  wget -O - https://debian.neo4j.com/neotechnology.gpg.key | sudo apt-key add -
                  echo 'deb https://debian.neo4j.com stable latest' | sudo tee -a /etc/apt/sources.list.d/neo4j.list
                  sudo apt-get update
                  sudo apt-get install -y cypher-shell

            # 3. DB 초기화 완벽 대기
            - name: Wait for Neo4j to be ready
              run: |
                  for i in {1..30}; do
                    if cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword "RETURN 'Ready';" > /dev/null 2>&1; then
                      echo "Neo4j is up and running!"
                      break
                    fi
                    echo "Waiting for Neo4j..."
                    sleep 2
                  done

            # 4. 의존성 순서에 맞춰 Cypher 파일 차례대로 실행 (하나라도 실패하면 즉시 종료)
            - name: Execute Cypher Scripts in strict order
              env:
                  DB_URI: neo4j://localhost:7687
                  DB_USER: neo4j
                  DB_PASS: testpassword
              run: |
                  set -e # 에러 발생 시 즉시 중단

                  echo "1. Running Team Project (v0.5)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f teamProject/tryna_team_project_knowledge_base_v0.5.cypher

                  echo "2. Running Travel (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f travel/tryna_travel_knowledge_base_v0.1.cypher

                  echo "3. Running Hangout (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f hangout/tryna_hangout_knowledge_base_v0.1.cypher

                  echo "4. Running Academic (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f academic/tryna_academic_knowledge_base_v0.1.cypher

                  echo "5. Running Social Occasion (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f socialOccasion/tryna_social_occasion_knowledge_base_v0.1.cypher

                  echo "6. Running Work/Career (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f workCareer/tryna_work_career_knowledge_base_v0.1.cypher

            # 5. 스모크 테스트 수치 자동 검증 (104개 노드, 189개 RECOMMENDS 관계)
            - name: Validate Database Integrity (Smoke Check)
              run: |
                  echo "Fetching totals from Neo4j..."

                  # 텍스트 포맷 없이 결과 숫자만 깔끔하게 가져오기 위해 --format plain 및 tail 사용
                  NODE_COUNT=$(cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword --format plain "MATCH (n) WHERE n:Context OR n:EventType OR n:PlaceType OR n:RecommendationTemplate RETURN count(n);" | tail -n 1 | tr -d ' ')
                  RECOMMENDS_COUNT=$(cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword --format plain "MATCH ()-[r:RECOMMENDS]->() RETURN count(r);" | tail -n 1 | tr -d ' ')

                  echo "----------------------------------------"
                  echo "📊 Current Nodes Count: $NODE_COUNT (Expected: 104)"
                  echo "🔗 Current RECOMMENDS Count: $RECOMMENDS_COUNT (Expected: 189)"
                  echo "----------------------------------------"

                  # 검증 로직: 숫자가 일치하지 않으면 exit 1로 CI 강제 실패 처리
                  if [ "$NODE_COUNT" -ne 104 ]; then
                    echo "❌ ERROR: Node count mismatch!"
                    exit 1
                  fi

                  if [ "$RECOMMENDS_COUNT" -ne 189 ]; then
                    echo "❌ ERROR: RECOMMENDS relationship count mismatch!"
                    exit 1
                  fi

                  echo "✅ SUCCESS: All database integrity checks passed!"

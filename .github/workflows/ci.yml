name: Neo4j Cypher Test CI

on:
    pull_request:
        branches: ["main", "develop"]
    push:
        branches: ["develop"]
    workflow_dispatch: # 수동으로도 실행할 수 있도록 추가

jobs:
    test-and-verify-cypher:
        runs-on: ubuntu-latest

        # 1. 테스트용 빈 Neo4j 컨테이너 실행
        services:
            neo4j:
                image: neo4j:5
                env:
                    NEO4J_AUTH: neo4j/testpassword
                ports:
                    - 7687:7687
                # DB가 완전히 켜질 때까지 기다리는 Health Check
                options: >-
                    --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
                    --health-interval 10s
                    --health-timeout 10s
                    --health-retries 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. cypher-shell 설치
            - name: Install cypher-shell
              run: |
                  wget -O - https://debian.neo4j.com/neotechnology.gpg.key | sudo apt-key add -
                  echo 'deb https://debian.neo4j.com stable latest' | sudo tee -a /etc/apt/sources.list.d/neo4j.list
                  sudo apt-get update
                  sudo apt-get install -y cypher-shell

            # 3. DB 초기화 완벽 대기
            - name: Wait for Neo4j to be ready
              run: |
                  for i in {1..30}; do
                    if cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword "RETURN 'Ready';" > /dev/null 2>&1; then
                      echo "Neo4j is up and running!"
                      break
                    fi
                    echo "Waiting for Neo4j..."
                    sleep 2
                  done

            # 4. 의존성 순서에 맞춰 Cypher 파일 차례대로 실행 (하나라도 실패하면 즉시 종료)
            - name: Execute Cypher Scripts in strict order
              env:
                  DB_URI: neo4j://localhost:7687
                  DB_USER: neo4j
                  DB_PASS: testpassword
              run: |
                  set -e # 에러 발생 시 즉시 중단

                  echo "1. Running Team Project (v0.5)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f teamProject/tryna_team_project_knowledge_base_v0.5.cypher

                  echo "2. Running Travel (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f travel/tryna_travel_knowledge_base_v0.1.cypher

                  echo "3. Running Hangout (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f hangout/tryna_hangout_knowledge_base_v0.1.cypher

                  echo "4. Running Academic (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f academic/tryna_academic_knowledge_base_v0.1.cypher

                  echo "5. Running Social Occasion (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f socialOccasion/tryna_social_occasion_knowledge_base_v0.1.cypher

                  echo "6. Running Work/Career (v0.1)..."
                  cypher-shell -a $DB_URI -u $DB_USER -p$DB_PASS -f workCareer/tryna_work_career_knowledge_base_v0.1.cypher

            # 5. 스모크 테스트 (데이터 무결성 결함 및 고도화 검증)
            - name: Validate Database Integrity (Defect Check)
              run: |
                  echo "Checking for invalid nodes, relationships, orphans, and enum errors..."

                  # 1. 필수 속성이 누락된 불량 추천 템플릿(RecommendationTemplate) 개수 확인
                  INVALID_NODES=$(cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword --format plain "MATCH (r:RecommendationTemplate) WHERE r.embeddingText IS NULL OR r.conditionalText IS NULL OR r.suggestionLevel IS NULL RETURN count(r);" | tail -n 1 | tr -d ' ')

                  # 2. 필수 속성이 누락된 불량 추천 관계(RECOMMENDS) 개수 확인
                  INVALID_RELS=$(cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword --format plain "MATCH ()-[rel:RECOMMENDS]->() WHERE rel.defaultRank IS NULL OR rel.suggestionMode IS NULL RETURN count(rel);" | tail -n 1 | tr -d ' ')

                  # 3. 아무와도 연결되지 않은 고아 노드(Orphan Node) 확인
                  ORPHAN_NODES=$(cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword --format plain "MATCH (r:RecommendationTemplate) WHERE NOT ()-[:RECOMMENDS]->(r) RETURN count(r);" | tail -n 1 | tr -d ' ')

                  # 4. Enum 오타 검증 (suggestionLevel)
                  ENUM_ERRORS=$(cypher-shell -a neo4j://localhost:7687 -u neo4j -p testpassword --format plain "MATCH (r:RecommendationTemplate) WHERE NOT r.suggestionLevel IN ['safe', 'contextual', 'conditional'] RETURN count(r);" | tail -n 1 | tr -d ' ')

                  echo "----------------------------------------"
                  echo "🚨 Invalid Nodes Found: $INVALID_NODES"
                  echo "🚨 Invalid Relationships Found: $INVALID_RELS"
                  echo "👻 Orphan Nodes Found: $ORPHAN_NODES"
                  echo "🔠 Enum Errors Found: $ENUM_ERRORS"
                  echo "----------------------------------------"

                  # 검증 로직: 불량 데이터가 1개라도 발견되면 CI 강제 실패 처리
                  if [ "$INVALID_NODES" -ne 0 ]; then
                    echo "❌ ERROR: Found RecommendationTemplates with missing required properties!"
                    exit 1
                  fi

                  if [ "$INVALID_RELS" -ne 0 ]; then
                    echo "❌ ERROR: Found RECOMMENDS relationships with missing required properties!"
                    exit 1
                  fi

                  if [ "$ORPHAN_NODES" -ne 0 ]; then
                    echo "❌ ERROR: Found disconnected (orphan) RecommendationTemplates!"
                    exit 1
                  fi

                  if [ "$ENUM_ERRORS" -ne 0 ]; then
                    echo "❌ ERROR: Found invalid values in suggestionLevel!"
                    exit 1
                  fi

                  echo "✅ SUCCESS: All database integrity checks passed! No defects found."
